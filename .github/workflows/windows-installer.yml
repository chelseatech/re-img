name: Windows installer

# Deliberately scoped to the repair and Create preset branches. A workflow edit only starts a build
# when its commit message begins with [build-windows]. Check the organization
# Actions allowance before requesting another build. No tags or releases.
# The Run workflow button becomes available only after this file is added to
# the default branch; that merge is a separate decision.
on:
  push:
    branches: [fix/icc-colour-import, feat/create-preset, feat/re-image-desktop-branding]
    paths: [.github/workflows/windows-installer.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.repository == 'chelseatech/web-image-prep' &&
      (github.ref == 'refs/heads/fix/icc-colour-import' || github.ref == 'refs/heads/feat/create-preset' || github.ref == 'refs/heads/feat/re-image-desktop-branding') &&
      (github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, '[build-windows]') || startsWith(github.event.head_commit.message, '[build-desktop]'))
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      RUSTUP_TOOLCHAIN: 1.99.0
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out the exact requested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Set up the verified Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version
          cargo --version
          node --version
          npm --version

      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts

      - name: Generate application icons
        run: npm run icons

      - name: Check JavaScript and crop regressions
        run: |
          npm run check
          node .github/scripts/branding-check.mjs

      - name: Test image processing on native Windows
        run: cargo test --release --locked --manifest-path crates/prep-core/Cargo.toml

      - name: Build the unsigned Windows NSIS installer
        run: npm run tauri -- build --ci --no-sign --config src-tauri/tauri.release-nsis.conf.json -- --locked

      - name: Verify installer, install and launch smoke test
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          node .github/scripts/branding-check.mjs --built
          if ($LASTEXITCODE -ne 0) { throw 'Compiled branding check failed.' }
          $installers = @(Get-ChildItem "$env:CARGO_TARGET_DIR/release/bundle/nsis/*-setup.exe")
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer; found $($installers.Count)." }
          $installer = $installers[0]
          if ($installer.Length -gt 100MB) { throw 'Installer exceeds the 100 MB artifact safety cap.' }
          $installDir = Join-Path $env:RUNNER_TEMP 'web-image-prep-smoke'
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDir") -WindowStyle Hidden -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "NSIS installation failed: $($install.ExitCode)." }
          $exe = Join-Path $installDir 'web-image-prep.exe'
          if (!(Test-Path $exe)) { throw 'Installed app executable was not found.' }
          $app = Start-Process -FilePath $exe -WindowStyle Hidden -PassThru
          try {
            Start-Sleep -Seconds 15
            $app.Refresh()
            if ($app.HasExited) { throw "App exited during startup smoke test: $($app.ExitCode)." }
            $windowTitle = $app.MainWindowTitle
            $windowHandle = $app.MainWindowHandle.ToInt64()
            Write-Host "App remained running for 15 seconds. Window title: $windowTitle; handle: $windowHandle"
          } finally {
            if (!$app.HasExited) { Stop-Process -Id $app.Id -Force }
          }
          $output = Join-Path $env:GITHUB_WORKSPACE 'installer-artifact'
          New-Item -ItemType Directory -Path $output | Out-Null
          Copy-Item $installer.FullName $output
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Encoding utf8 (Join-Path $output 'SHA256SUMS.txt')
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          @"
          re-image $version - Windows x64 NSIS installer
          Source commit: $env:GITHUB_SHA
          Workflow run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID
          SHA-256: $hash
          Checks: frontend syntax/crop tests, native Windows image-processing tests,
          release compilation, NSIS silent installation, and 15-second process startup.
          Startup window title: $windowTitle
          Startup window handle: $windowHandle
          Not covered: interactive picker/drop/crop/export acceptance on a user's PC.
          This is an unsigned test build; Windows may display an unknown-publisher warning.
          Do not disable Windows security protections to install it.
          "@ | Set-Content -Encoding utf8 (Join-Path $output 'BUILD-INFO.txt')
          Get-Content (Join-Path $output 'BUILD-INFO.txt') | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Verify native preset creation and persistence across restart
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:CARGO_TARGET_DIR 'release/web-image-prep.exe'
          if (!(Test-Path -LiteralPath $exe)) { throw 'Portable executable was not found.' }
          $resultDir = Join-Path $env:GITHUB_WORKSPACE 'installer-artifact'
          $presetName = "CI reusable preset $env:GITHUB_RUN_ID"
          # Microsoft documents process-scoped WebView2 debugging arguments:
          # https://learn.microsoft.com/en-us/microsoft-edge/webview2/how-to/debug-visual-studio-code
          # These flags are test-only, inherited by spawned CI processes, never shipped.
          $previousArguments = $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--remote-debugging-port=9224 --remote-debugging-address=127.0.0.1'
          try {
            foreach ($mode in @('create', 'verify')) {
              $app = Start-Process -FilePath $exe -WindowStyle Hidden -PassThru
              try {
                node .github/scripts/preset-smoke.mjs $mode 9224 $presetName $resultDir
                if ($LASTEXITCODE -ne 0) { throw "Native preset $mode check failed." }
                $app.Refresh()
                if ($app.HasExited) { throw "App exited during native preset $mode check." }
              } finally {
                if (!$app.HasExited) { Stop-Process -Id $app.Id -Force }
              }
              # Let WebView2 release its user-data storage and debugger before restart.
              Start-Sleep -Seconds 3
            }
          } finally {
            $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = $previousArguments
          }

      - name: Package the portable executable with source and validation details
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:CARGO_TARGET_DIR 'release/web-image-prep.exe'
          $portableDir = Join-Path $env:RUNNER_TEMP 'web-image-prep-portable'
          New-Item -ItemType Directory -Path $portableDir | Out-Null
          $renamedExe = Join-Path $portableDir 're-image.exe'
          Copy-Item -LiteralPath $exe -Destination $renamedExe
          if ((Get-Item -LiteralPath $renamedExe).VersionInfo.ProductName -ne 're-image') { throw 'Portable executable product metadata is not re-image.' }
          $previousArguments = $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--remote-debugging-port=9224 --remote-debugging-address=127.0.0.1'
          $app = Start-Process -FilePath $renamedExe -WindowStyle Hidden -PassThru
          try {
            node .github/scripts/preset-smoke.mjs verify 9224 "CI reusable preset $env:GITHUB_RUN_ID" $portableDir
            if ($LASTEXITCODE -ne 0) { throw 'Renamed portable app could not restore existing presets.' }
          } finally {
            if (!$app.HasExited) { Stop-Process -Id $app.Id -Force }
            $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = $previousArguments
          }
          Copy-Item -LiteralPath README.md,PRESET-VALIDATION.md,UOTTAWA-VALIDATION.md -Destination $portableDir
          $output = Join-Path $env:GITHUB_WORKSPACE 'installer-artifact'
          Copy-Item -LiteralPath (Join-Path $output 'native-preset-create.json') -Destination $portableDir
          $exeHash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          @"
          re-image $version — Windows x64 portable test build
          Source commit: $env:GITHUB_SHA
          Workflow run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID
          Executable SHA-256: $exeHash
          Verified: frontend tests/build, native Rust core tests, release compilation,
          installed-app startup, and native Create preset save/restart/persistence.
          Extract the whole ZIP, then run re-image.exe. Requires the normal
          Windows WebView2 Runtime. This unsigned build may show a publisher warning;
          do not disable Windows security protections.
          Create preset: Prepare your export > Website profile > Create preset.
          Choose a unique name, dimensions, format and optional KB target > Save preset.
          Original files are preserved; no upscaling; uOttawa remains JPEG/PNG only.
          Not covered: interactive file picker/drop/crop and real image export on a user's PC.
          "@ | Set-Content -Encoding utf8 (Join-Path $portableDir 'BUILD-INFO.txt')
          $portableZip = Join-Path $output "re-image-$version-windows-x64-portable.zip"
          Compress-Archive -LiteralPath $portableDir -DestinationPath $portableZip
          if ((Get-Item -LiteralPath $portableZip).Length -gt 50MB) { throw 'Portable ZIP exceeds 50 MB limit.' }
          if ((Get-ChildItem -LiteralPath $output -File | Measure-Object Length -Sum).Sum -gt 100MB) { throw 'Combined Windows artifacts exceed 100 MB limit.' }
          $zipHash = (Get-FileHash -LiteralPath $portableZip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$zipHash  $([IO.Path]::GetFileName($portableZip))" | Add-Content (Join-Path $output 'SHA256SUMS.txt')
          Get-Content (Join-Path $portableDir 'BUILD-INFO.txt') | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Save the private installer and verification summary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: re-image-windows-x64-${{ github.sha }}
          path: installer-artifact/*
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
          include-hidden-files: false
