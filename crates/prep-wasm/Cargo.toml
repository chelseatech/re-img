[package]
name = "prep-wasm"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
prep-core = { path = "../prep-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png", "webp"] }

[dev-dependencies]
moxcms = "=0.8.1"

[profile.release]
lto = true
opt-level = 3
panic = "abort"
